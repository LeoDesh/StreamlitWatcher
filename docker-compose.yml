services:
  # 1. Ihre Streamlit App
  streamlit-app:
    build: .
    command:
      [
       "python","-m", "streamlit","run", "app.py", "streamlit",
        "--server.port=8501",
        "--server.address=0.0.0.0",
        "--server.fileWatcherType=poll"
      ]
    container_name: streamlit_app
    restart: unless-stopped
    expose:
      - "8501"
    volumes:
      - ./${GARMIN_TOKEN_DIR}:/app/${GARMIN_TOKEN_DIR}
      - ./app.py:/app/app.py
      - ./garmin:/app/garmin
      - ./pyproject.toml:/app/pyproject.toml

  # 2. Der offizielle Nginx Webserver
  nginx:
    image: nginx:alpine
    container_name: nginx_webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Hier wird Ihre Config aus dem Repo in den Container gemountet
      - ./nginx/streamlit.conf:/etc/nginx/templates/default.conf.template:ro
      # Gemeinsame Volumes mit Certbot für Zertifikate und Validierung
      - ${SSL_PATH}:${SSL_MOUNT}:ro
      # NEU: Mount für die ACME-Challenge
      - ${CERTBOT_WWW_PATH}:/var/www/certbot:ro
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - SSL_CERT_FILE=${SSL_CERT_FILE}
      - SSL_KEY_FILE=${SSL_KEY_FILE}
    #  - NGINX_ENVSUBST_FILTER=APP_DOMAIN SSL_CERT_FILE SSL_KEY_FILE
    depends_on:
      - streamlit-app

  # 3. The Redis Broker
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  worker:
    build: .
    command: ["python", "app.py", "worker"]
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./app.py:/app/app.py
      - ./garmin:/app/garmin
      - ./${GARMIN_TOKEN_DIR}:/app/${GARMIN_TOKEN_DIR}
      
  scheduler:
    build: .
    command: ["python", "app.py", "schedule"]
    environment:
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./app.py:/app/app.py
      - ./garmin:/app/garmin

volumes:
  redis_data: