# 1. HTTP: Fängt alle Anfragen ab
server {
    listen 80;
    server_name ${APP_DOMAIN};

    # Wichtig für die Let's Encrypt Validierung (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Leitet allen anderen HTTP-Traffic auf HTTPS um
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS: Ihre verschlüsselte Streamlit-App
server {
    listen 443 ssl;
    server_name ${APP_DOMAIN};

    # Pfade werden dynamisch über Umgebungsvariablen injiziert
    ssl_certificate    ${SSL_CERT_FILE};
    ssl_certificate_key ${SSL_KEY_FILE};

    # SSL-Optimierungen
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://streamlit-app:8501; # Docker-Name der App
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Essenziell für Streamlit (WebSockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}