name: Run Pytest with uv

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Code aus dem GitHub-Repository auschecken
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. uv installieren und Python-Version aus pyproject.toml lesen
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        # Aktiviert das Caching für extrem schnelle Folgeläufe
        enable-cache: true

    # 3. Projekt-Abhängigkeiten synchronisieren
    # "uv sync" installiert alle Pakete aus deiner pyproject.toml / uv.lock
    - name: Install dependencies
      run: uv sync

    # 4. Pytest isoliert in der uv-Umgebung ausführen
    - name: Run tests with pytest
      run: uv run pytest
      
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync

    - name: Run Ruff Check & Format
      run: |
        uv run ruff check
        uv run ruff format --check